<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Sign Up</title>
  <link rel="stylesheet" href="../style/reset-variables.css">
  <link rel="stylesheet" href="./auth.css">
</head>
<body>

<div class="auth-container">

  <form id="signup-form" class="auth-form" action="#">

    <h2>عضویت</h2>

    <input type="text" name="firstname" placeholder="نام" required>
    <input type="text" name="lastname" placeholder="نام خانوادگی" required>
    <input type="tel" name="phone" placeholder="شماره تلفن" required>
    <div class="error" id="signup-phone-error"></div>
    <input type="password" name="password" placeholder="رمز عبور" required>
    <div class="error" id="signup-password-error"></div>

    <button class="submit" type="submit">ثبت نام</button>

    <p class="subtitle"> قبلا عضو شده اید؟ <a href="./login.html">ورود</a></p>
  </form>

</div>

<script src="./auth.js"></script>
</body>
</html>
