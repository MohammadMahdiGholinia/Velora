<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Velora یک وب‌سایت مدرن برای جستجو و رزرو تورهای گردشگری است که به کاربران کمک می‌کند سفرهای خاص و به‌یادماندنی خود را برنامه‌ریزی کنند.">
  <meta name="title" content="Velora | رزرو تور و تجربه‌های خاص سفر">
  <title>Velora | رزرو تور و تجربه‌های خاص سفر</title>
  <link rel="icon" href="./assets/logo.png">
  <link rel="stylesheet" href="./style/reset-variables.css">
  <link rel="stylesheet" href="./style/style.css">

</head>
<body>
  <div id="preloader"></div>


<!-- HEADER -->
<header class="header" data-header>
  <div class="container">

    <a href="#">
      <img src="./assets/images/temp-logo.svg" width="187" height="38" alt="logo">
    </a>

    <nav class="navbar" data-nav>
      <div class="navbar-top">
        <a href="#">
          <img src="./assets/images/temp-logo.svg" width="187" height="38" alt="logo">
        </a>

        <button class="nav-toggle-btn" aria-label="close menu" data-nav-toggler>
          <ion-icon name="close-outline" aria-hidden="true"></ion-icon>

        </button>
      </div>
      <ul class="navbar-list">
        <li class="navbar-item" > <a href="#" class="navbar-link">خانه</a></li>
        <li class="navbar-item"> <a href="#" class="navbar-link">تور داخلی</a></li>
        <li class="navbar-item"> <a href="#" class="navbar-link">تور خارجی</a></li>
        <li class="navbar-item"> <a href="#" class="navbar-link">تور یک روزه</a></li>
        <li class="navbar-item"> <a href="#" class="navbar-link">تور ناشناس</a></li>
      </ul>
      
      <div class="header-action">
        <a href="#" class="login-btn"> ورود</a>
        <a href="#" class="btn btn-primary">عضویت</a>
      </div>
      

      <button> </button>
    </nav>

    <button class="nav-toggle-btn" aria-label="open menu" data-nav-toggler>
      <ion-icon name="menu-outline" aria-hidden="true"></ion-icon>
    </button>

    <div class="overlay" data-overlay data-nav-toggler></div>
  </div>
</header>

<main>
   <!-- Hero Section-->
     <section class="hero" data-hero>

       <div class="hero-bg hero-bg-1"></div>
        <div class="hero-bg hero-bg-2"></div>

         <div class="hero-overlay"></div>
          <div class="hero-content container">
             <h1 class="hero-title"> دنیا منتظر توست </h1>
             <p class="hero-subtitle"> سفر بعدی‌ات را همین حالا پیدا کن </p>
           </div> 
           
           <div class="hero-search container">
            <div class="hero-search-box">

              <div class="hero-field">
                <label for="destination-input"> مقصد</label>
                <input id="destination-input" type="text" placeholder="کجا می‌خوای بری؟">
              </div>
              <div class="hero-field">
                <label for="month-input"> تاریخ</label>
                <input id="month-input" type="text">

                
              </div>
              
              <button class="search-btn btn"> جستجو</button>

              <div id="month-modal" class="month-modal">
                <button class="month-button"> فروردین</button>
                <button class="month-button"> اردیبهشت</button>
                <button class="month-button"> خرداد</button>
                <button class="month-button"> تیر</button>
                <button class="month-button"> مرداد</button>
                <button class="month-button"> شهریور</button>
                <button class="month-button"> مهر</button>
                <button class="month-button"> آبان</button>
                <button class="month-button"> آذر</button>
                <button class="month-button"> دی</button>
                <button class="month-button"> بهمن</button>
                <button class="month-button"> اسفند</button>
              </div>

          
            </div>
           </div>
           

      </section>
</main>



<script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
  <script src="./script/script.js"></script>
</body>
</html>
