<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Sign Up</title>
  <link rel="stylesheet" href="./auth.css">
</head>
<body>

<div class="auth-container">

  <form id="signupForm" class="auth-form">

    <h2>عضویت</h2>

    <input type="text" name="firstname" placeholder="نام" required>
    <input type="text" name="lastname" placeholder="نام خانوادگی" required>
    <input type="tel" name="phone" placeholder="شماره تلفن" required>
    <input type="password" name="password" placeholder="رمز عبور" required>
    <input type="password" name="password" placeholder="تکرار رمز عبور" required>

    <button type="submit">ثبت نام</button>

    <p>عضو ولورا هستید؟ <a href="./login.html">ورود</a></p>
  </form>

</div>

<script src="./auth.js"></script>
</body>
</html>
