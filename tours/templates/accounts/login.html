{% load static %}


<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link rel="stylesheet" href="{% static 'css/reset-variables.css' %}">
  <link rel="stylesheet" href="{% static 'css/auth.css' %}">
  
</head>
<body>

<div class="auth-container">

  <form id="login-form" class="auth-form" method="POST">
    {% csrf_token %}

    <h2>ورود</h2>

    <input type="tel" name="phone" placeholder="شماره تلفن" required>
    <div class="error" id="login-phone-error"></div>
    <input type="password" name="password" placeholder="رمز عبور" required>
    <div class="error" id="login-password-error"></div>

    <button class="submit" type="submit">ورود</button>

    <p class="subtitle">عضو ولورا نیستید؟ <a href="">عضویت</a></p>
  </form>

</div>

<script src=""></script>
</body>
</html>
