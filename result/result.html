<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Velora یک وب‌سایت مدرن برای جستجو و رزرو تورهای گردشگری است که به کاربران کمک می‌کند سفرهای خاص و به‌یادماندنی خود را برنامه‌ریزی کنند.">
  <meta name="title" content="Velora | رزرو تور و تجربه‌های خاص سفر">
  <title>Velora | رزرو تور و تجربه‌های خاص سفر</title>
  <link rel="icon" href="../assets/logo.png">
  <link rel="stylesheet" href="../style/reset-variables.css">
  <link rel="stylesheet" href="./result.css">

</head>
<body>
  <div id="preloader"></div>


<!-- HEADER -->
<header class="header" data-header>
  <div class="container">

    <a href="#" class="logo">
      <img src="../assets/images/temp-logo.svg" height="38" alt="logo">
    </a>

    <nav class="navbar" data-nav>
      <div class="navbar-top">
        <a href="#" class="logo">
          <img src="../assets/images/temp-logo.svg" height="38" alt="logo">
        </a>

        <button class="nav-toggle-btn" aria-label="close menu" data-nav-toggler>
          <ion-icon name="close-outline" aria-hidden="true"></ion-icon>

        </button>
      </div>
      <ul class="navbar-list">
        <li class="navbar-item" > <a href="#" class="navbar-link">خانه</a></li>
        <li class="navbar-item"> <a href="#" class="navbar-link">تور داخلی</a></li>
        <li class="navbar-item"> <a href="#" class="navbar-link">تور خارجی</a></li>
        <li class="navbar-item"> <a href="#" class="navbar-link">تور یک روزه</a></li>
        <li class="navbar-item"> <a href="#" class="navbar-link">تور ناشناس</a></li>
      </ul>
      
      <div class="header-action">
        <div class="loggedout">
          <a href="./auth/login.html" class="btn login-btn"> ورود</a>
          <a href="./auth/signup.html" class="btn btn-primary">عضویت</a>
        </div>
        <div class="loggedin">
          <a href="#" class="login-btn"> پنل کاربری</a>
          <a href="#" class="btn btn-primary">خروج </a>

        </div>

      </div>
      

      <button> </button>
    </nav>

    <button class="nav-toggle-btn" aria-label="open menu" data-nav-toggler>
      <ion-icon name="menu-outline" aria-hidden="true"></ion-icon>
    </button>

    <div class="overlay" data-overlay data-nav-toggler></div>
  </div>
</header>

<main>
   <!-- Hero Section-->
    <section class="hero" data-hero>
      <div class="container">
        <div class="hero-bg hero-bg-1"></div>
        <div class="hero-bg hero-bg-2"></div>

        <div class="hero-overlay"></div>

        <div class="hero-content">
          <h1 class="hero-title" id="hero-title"></h1>
        </div>

      </div>
        



    </section>


           
    
           

  
      <section class="result-tours">

        <div class="container">
          <div class="result-tours-title">
            <h2 id="result-tours-title-h2"></h2>
          </div>

          <div class="results-layout">

            <aside class="filters" data-filters>

              <button class="filter-toggle" data-filter-toggle>
                <div class="filter-header-right">
                  <ion-icon name="options-outline"></ion-icon>
                  <h3>مرتب سازی</h3>
                </div>
                <ion-icon class="chevron" name="chevron-down-outline"></ion-icon>
                

              </button>
        

              <div class="filter-group">

                <label for="" class="filter-item">
                  <input type="radio" name="sort" value="default" checked>
                  <span>پیش فرض</span>
                </label>

                <label for="" class="filter-item">
                  <input type="radio" name="sort" value="cheap">
                  <span>ارزان ترین قیمت</span>
                </label>

                <label for="" class="filter-item">
                  <input type="radio" name="sort" value="expensive">
                  <span>گران ترین قیمت</span>
                </label>
                <label for="" class="filter-item">
                  <input type="radio" name="sort" value="duration">
                  <span>بیشترین مدت زمان</span>
                </label>


              </div>



            </aside>
              

              <div class="tours-grid"></div>
          </div>

        </div>

        









      </section>



</main>








  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
  <script src="./result.js" defer></script>
</body>
</html>
